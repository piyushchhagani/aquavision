[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquavision"
version = "0.1.0"
description = "Multimodal Computer Vision System for Water-Surface Pollution Detection and Environmental Analytics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
